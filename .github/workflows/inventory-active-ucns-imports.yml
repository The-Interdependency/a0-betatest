name: Inventory active pre-reset UCNS imports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inventory-active-ucns-imports.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repair branch
        uses: actions/checkout@v5
        with:
          ref: agent/suspend-pre-reset-ucns
          fetch-depth: 0
      - name: Record active imports and references
        shell: bash
        run: |
          mkdir -p repair/generated
          {
            echo '# Active pre-reset UCNS dependency inventory'
            echo
            echo 'Generated from branch `agent/suspend-pre-reset-ucns`.'
            echo
            echo '```text'
            grep -RInE '(^|[[:space:]])(import ucns|from ucns|from ucns_recursive)|UCNSObject|ucns_bridge|phase_compose|UCNSNativeEmbedding' backend \
              --include='*.py' \
              --exclude-dir='__pycache__' \
              --exclude-dir='.pytest_cache' \
              | sort || true
            echo '```'
          } > repair/generated/ACTIVE_UCNS_IMPORTS.md
      - name: Commit inventory to target branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repair/generated/ACTIVE_UCNS_IMPORTS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'audit: inventory active pre-reset UCNS imports'
          git push origin HEAD:agent/suspend-pre-reset-ucns

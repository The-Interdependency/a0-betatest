name: Regenerate reset-boundary README

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/regenerate-reset-boundary-docs.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: agent/suspend-pre-reset-ucns
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Regenerate README from current declarations
        run: A0P_ALLOW_DOC_WRITE=1 python backend/readme_writer.py
      - name: Commit README to repair branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: regenerate UCNS reset-boundary README'
          git push origin HEAD:agent/suspend-pre-reset-ucns

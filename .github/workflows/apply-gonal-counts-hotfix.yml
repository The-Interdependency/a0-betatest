name: Apply gonal validation counts hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gonal-counts-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v5
        with:
          ref: agent/restore-gonal-validation-counts
          fetch-depth: 0
      - name: Restore validation counts and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          gonal = Path('backend/interdependent_lib/gonal/gonal.py')
          text = gonal.read_text(encoding='utf-8')
          old = '    return {"valid": not violations, "violations": violations, "n": n}\n'
          new = dedent('''\
              def category(ch: str) -> str:
                  if ch in UPPERCASE:
                      return "uppercase"
                  if ch in LOWERCASE:
                      return "lowercase"
                  if ch in string.digits:
                      return "digit"
                  if ch in PAIRED_OPEN:
                      return "paired_open"
                  if ch in PAIRED_CLOSE:
                      return "paired_close"
                  if ch == spec.origin:
                      return "origin"
                  return "unpaired"

              counts = {
                  name: sum(1 for ch in slot if category(ch) == name)
                  for name in (
                      "uppercase", "lowercase", "digit", "paired_open",
                      "paired_close", "unpaired", "origin",
                  )
              }
              return {
                  "valid": not violations,
                  "violations": violations,
                  "warnings": [],
                  "counts": counts,
                  "n": n,
              }
          ''')
          if text.count(old) != 1:
              raise SystemExit('validate_gonal return block drift')
          gonal.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('backend/tests/test_reset_boundaries.py')
          text = test.read_text(encoding='utf-8')
          marker = '\n\ndef test_ucns_runtime_is_typed_absence():\n'
          addition = dedent('''\

          def test_public_gonol_validation_counts_are_available():
              from interdependent_lib.gonal.gonal import (
                  GonalSpec,
                  PUBLIC_GONOL_157,
                  validate_gonal,
              )

              report = validate_gonal(PUBLIC_GONOL_157, GonalSpec())
              assert report["valid"] is True
              assert report["counts"]["origin"] == 1
              assert report["counts"]["uppercase"] == 26
              assert report["counts"]["lowercase"] == 26
              assert report["counts"]["digit"] == 10


          def test_public_gonals_endpoint_count_contract_is_preserved():
              from interdependent_lib.gonal.gonal import GonalSpec, get_default, validate_gonal

              report_keys = {"valid", "violations", "warnings", "counts", "n"}
              assert report_keys <= set(validate_gonal(get_default(), GonalSpec()))
          ''')
          if text.count(marker) != 1:
              raise SystemExit('reset test insertion marker drift')
          test.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY
          python -m compileall -q backend
          python -m pip install -q -r backend/requirements.txt pytest pytest-asyncio
          python -m pytest -q backend/tests/test_reset_boundaries.py
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/interdependent_lib/gonal/gonal.py backend/tests/test_reset_boundaries.py
          git commit -m 'fix(gonal): restore validation category counts'
          git push origin HEAD:agent/restore-gonal-validation-counts
